version: '3.8'

# LISA production service.
#
# Persistence: the SQLite ledger is the record of every pick, so it lives in a
# bind mount (./data) that survives image rebuilds and is easy to back up.
# The container runs as LISA_UID:LISA_GID because a bind mount is owned by the
# host user; a fixed in-image uid cannot write it without root.
#
# Note there is deliberately no ./web/data mount: the dashboard reads live data
# from the API, and mounting a path for a deleted directory would have Docker
# silently recreate it.

services:
  lisa:
    build:
      context: .
      dockerfile: Dockerfile
    image: lisa:local
    container_name: lisa_sports_engine
    restart: unless-stopped
    # Matches the host user so ./data stays writable without root. Override in
    # .env (LISA_UID / LISA_GID) if the deployment user differs.
    user: "${LISA_UID:-1000}:${LISA_GID:-1000}"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - LISA_STORAGE=sqlite
      - LISA_DATABASE_URL=/app/data/lisa.db
    # Stopping should be quick and must not leave a half-written database.
    stop_grace_period: 30s
    # Keep the ledger from growing without bound on a long-running deployment.
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
