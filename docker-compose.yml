# Pre-production architecture: persistent PostgreSQL, web readers, autonomous jobs.
x-app: &app
  build: .
  image: lisa:local
  restart: unless-stopped
  env_file: .env
  environment: &app-environment
    LISA_STORAGE: postgres
    LISA_DATABASE_URL: postgresql://lisa:${LISA_DATABASE_PASSWORD:?Set LISA_DATABASE_PASSWORD in .env}@db:5432/lisa
    LISA_ENABLE_ODDS_API: "0"
    LISA_PROVIDER_CREDENTIALS_PATH: /app/data/provider-credentials.json
    # env_file contains bootstrap secrets; remove admin credentials from apps.
    POSTGRES_ADMIN_PASSWORD: ""
    LISA_DATABASE_PASSWORD: ""
  depends_on:
    db:
      condition: service_healthy
  stop_grace_period: 45s
  volumes:
    - application-data:/app/data
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lisa
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      LISA_DATABASE_PASSWORD: ${LISA_DATABASE_PASSWORD:?Set LISA_DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-lisa.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lisa"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No database port exposed to the host or public network.

  web:
    <<: *app
    command: ["start", "--no-ingest", "--no-bot", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      disable: true

  telegram:
    <<: *app
    profiles: ["telegram"]
    command: ["start", "--no-ingest", "--port", "8081"]
    healthcheck:
      disable: true

  scalper:
    <<: *app
    profiles: ["scalper"]
    entrypoint: ["python3", "-m", "lisa.scalper"]
    command: ["run"]
    healthcheck:
      disable: true

volumes:
  postgres-data:
  application-data:
