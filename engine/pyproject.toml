[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lisa-engine"
version = "0.1.0"
description = "LISA data-refinery engine: Shin de-vig, multi-book consensus, quality gate, settlement."
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=7", "cryptography>=44,<47"]
redis = ["redis>=4"]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
cloud = ["cryptography>=44,<47"]
validation = ["requests>=2.32,<3"]
scalper-browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
