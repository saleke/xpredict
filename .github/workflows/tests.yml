name: Engine and PostgreSQL integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: lisa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: lisa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lisa -d lisa_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      LISA_TEST_POSTGRES_URL: postgresql://lisa:ci-only-password@localhost:5432/lisa_test
      PYTHONPATH: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e './engine[test,postgres,cloud,validation]'
      - run: python -m pytest engine/tests
      - run: node web/tests/test_model_board_render.js
      - run: node web/tests/test_render_all_robustness.js
      - run: node web/tests/test_accumulator_math.js
      - run: node web/tests/test_dashboard_updates.js
      - run: python scripts/build_vercel.py
  deploy:
    needs: engine
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VERCEL_CD_ENABLED == '1'
    runs-on: ubuntu-latest
    environment: production-testing
    concurrency:
      group: vercel-production-testing
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global vercel@59.11.7
      - run: python -m pip install './engine[validation]'
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Stage tested artifact without assigning the production domain
        id: stage
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Validate API, storage, paper mode, secret exclusion and cron authorization
        env:
          LISA_DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/run_deployed_jobs.py --smoke
      - name: Collect initial paper data and verify saved publication
        env:
          LISA_DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python scripts/run_deployed_jobs.py --bootstrap
      - name: Promote the validated deployment
        env:
          LISA_DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: vercel promote "$LISA_DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
