name: Production testing jobs
on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-testing-jobs
  cancel-in-progress: false
jobs:
  scheduled:
    if: vars.LISA_SCHEDULER_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-testing
    env:
      LISA_DEPLOYMENT_URL: ${{ vars.LISA_DEPLOYMENT_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './engine[validation]'
      - run: python scripts/run_deployed_jobs.py
      - name: Verify fresh saved data
        if: always()
        run: python scripts/run_deployed_jobs.py --verify-data
